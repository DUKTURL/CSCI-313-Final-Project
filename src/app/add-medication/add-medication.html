<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">Add Medication</h4>

      <!-- name field -->
      <div class="mb-3">
        <label class="form-label">Name</label>

        <input
          type="text"
          class="form-control"
          placeholder="e.g. Vitamin D"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
      </div>

      <!-- description field-->
      <div class="mb-3">
        <label class="form-label">Description</label>

        <textarea
          class="form-control"
          rows="2"
          placeholder="Optional notes..."
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
        ></textarea>
      </div>

      <!-- time to take medication field -->
      <div class="mb-3">
        <label class="form-label">Hour (0-23)</label>

        <input
          type="number"
          class="form-control"
          min="0"
          max="23"
          [ngModel]="hour()"
          (ngModelChange)="hour.set($event)"
        />
      </div>

      <!-- Select the days of the week it should be taken -->
      <div class="mb-3">
        <label class="form-label">Days to Take</label>

        <div class="d-flex flex-wrap gap-2">
          @for (day of weekdays; track day) {
            <button
              type="button"
              class="btn btn-sm"
              [class.btn-primary]="days_to_take().includes(day)"
              [class.btn-outline-primary]="!days_to_take().includes(day)"
              (click)="toggleDay(day)"
            >
              {{ day }}
            </button>
          }
        </div>
      </div>

      <!-- call addMedication method -->
      <button class="btn btn-success w-100" (click)="addMedication()">Add Medication</button>
    </div>
  </div>
  <!-- Success message after adding a medication -->
  @if (message()) {
    <div class="alert alert-success mt-2 text-center">
      {{ message() }}
    </div>
  }
</div>
