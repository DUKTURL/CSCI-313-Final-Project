<div class="container d-flex flex-column align-items-center mt-4 calendar-container">
    <h2>{{ monthYear }}</h2>

    <div class="nav">
      <button (click)="prevMonth()">←</button>
      <button (click)="nextMonth()">→</button>
    </div>
    <div class="calendar-panel">
      <div class="calendar">
        <!-- Weekday labels -->
        @for (w of weekDays; track w) {
          <div class="header">{{ w }}</div>
        }

        <!-- Days -->
        @for (d of days; track $index) {
          <div class="day" [class.empty]="!d" (click)="go(d)">
            {{ d }}
          </div>
        }
      </div>
    </div>
  </div>
