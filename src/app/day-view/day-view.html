<!-- Displays the day timer in a scrollable card component on the day view -->
<div class="container-fluid p-4">
  <div class="card shadow-sm" style="width: 50%; height: 75vh">
    <div class="card-header fw-bold">Day Timer</div>

    <div class="card-body overflow-hidden">
      <app-day-timer class="d-block h-100" [date]="date()"></app-day-timer>
    </div>
  </div>

  <!-- RIGHT: medication panel -->
    
</div>
